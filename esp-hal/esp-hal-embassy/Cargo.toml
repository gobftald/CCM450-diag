[package]
name = "esp-hal-embassy"
version = "0.8.0"
edition = "2024"

[dependencies]
#console = { path = "../../console" }
#defmt = { version = "0.3.10", optional = true }
defmt = { version = "1.0", optional = true }
log-04 = { package = "log", version = "0.4", optional = true }
cfg-if = "1.0.0"
critical-section = { version = "1.2.0" }
esp-hal = { path = "../esp-hal" }
macros = { features = ["embassy"], package = "esp-hal-procmacros", path = "../esp-hal-procmacros" }
embassy-executor = { path = "../../embassy/embassy-executor", optional = true }
embassy-time-driver = { path = "../../embassy/embassy-time-driver", features = [ "tick-hz-1_000_000" ] }

[build-dependencies]
#esp-config = { path = "../esp-config", features = ["build"]}
esp-config = { version = "0.6.1", features = ["build"] }
#esp-metadata = { path = "../esp-metadata" }
esp-metadata-generated = { version = "0.3.0", features = ["build-script"] }

[features]
default = ["executors"]

esp32   = ["esp-hal/esp32"]
esp32c2 = ["esp-hal/esp32c2"]
esp32c3 = ["esp-hal/esp32c3"]
esp32c6 = ["esp-hal/esp32c6"]
esp32h2 = ["esp-hal/esp32h2"]
esp32s2 = ["esp-hal/esp32s2"]
esp32s3 = ["esp-hal/esp32s3"]

## Enable the `Executor`
executors = ["dep:embassy-executor"]