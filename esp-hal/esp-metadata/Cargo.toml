[package]
name = "esp-metadata"
version = "0.6.0"
edition = "2021"

[dependencies]
basic-toml = { version = "0.1.9", optional = true }
serde      = { version = "1.0.217", features = ["derive"], optional = true }
strum      = { version = "0.26.3", features = ["derive"], optional = true }

[features]
default = ["build"]
build = ["dep:basic-toml", "dep:serde", "dep:strum"]