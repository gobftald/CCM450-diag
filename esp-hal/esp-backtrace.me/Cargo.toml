[package]
name = "esp-backtrace"
version = "0.18.0"
edition = "2024"

[dependencies]
#console  = { path = "../../console", features = ["jtag_serial"] }      # default console
defmt = { version = "1.0.1", optional = true }
#esp-println = { version = "0.16.1", optional = true, default-features = false, path = "../esp-println" }
esp-println = { version = "0.16.0", default-features = false, features = ["critical-section"] }
#esp-config  = { version = "0.4.0", path = "../esp-config" }
esp-config  = { version = "0.6.1" }
esp-metadata-generated = { version = "0.3.0" }
heapless = "0.8"

[build-dependencies]
esp-config   = { version = "0.6.1", features = ["build"] }
esp-metadata-generated = { version = "0.3.0", features = ["build-script"] }

[features]
default = ["esp32c3"]

esp32c3 = []
#defmt   = ["dep:defmt", "console/defmt"]
#defmt   = ["dep:defmt"]

panic-handler     = []
exception-handler = []
