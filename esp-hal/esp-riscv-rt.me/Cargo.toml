[package]
name = "esp-riscv-rt"
version = "0.13.0"
edition = "2024"
rust-version = "1.88.0"

[lib]
test = false
bench = false

[dependencies]
defmt = { version = "1.0.1", optional = true }
#riscv-rt = { path = "../../riscv.me/riscv-rt.me", features = ["pre-init", "no-exceptions", "no-interrupts", "single-hart", "v-trap", "pre-default-start-trap"] }
riscv-rt = {version = "0.16.0", features = ["pre-init", "no-exceptions", "no-interrupts", "single-hart", "v-trap", "pre-default-start-trap"]}
#riscv = { path = "../../riscv.me/riscv.me" }
riscv = "0.15.0"

[features]
## Indicate that the device does NOT support `mie` and `mip` CSRs.
no-mie-mip = ["riscv-rt/no-xie-xip"]
## Indicate that the device has RTC RAM.
# we are not using esp32c3 RTC FAST Memory yet
rtc-ram = []

## Implement `defmt::Format`
#defmt = ["dep:defmt", "riscv-rt/defmt"]
defmt = ["dep:defmt"]
