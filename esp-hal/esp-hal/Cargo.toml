[package]
name = "esp-hal"
version = "1.0.0-beta.0"
edition = "2021"

[dependencies]
console = { path = "../../console", features = ["usb_uart"]}
procmacros = { package = "esp-hal-procmacros", path = "../esp-hal-procmacros" }
defmt = { version = "0.3.10", optional = true }
fugit = "0.3.7"
paste = "1.0.15"
delegate = "0.13.3"

# IMPORTANT:
# Each supported device MUST have its PAC included below along with a
# corresponding feature.
esp32c3 = { path = "../../esp-pacs/esp32c3", features = ["rt"], optional = true }

[features]
# Chip Support Feature Flags
# Target the ESP32.
esp32   = []
# Target the ESP32-C2.
esp32c2 = []

# Target the ESP32-C3.
esp32c3 = ["dep:esp32c3"]

# Target the ESP32-C6.
esp32c6 = []
# Target the ESP32-H2.
esp32h2 = []
# Target the ESP32-S2.
esp32s2 = []
# Target the ESP32-S3.
esp32s3 = []

defmt   = [
    "dep:defmt",
    "esp-riscv-rt/defmt",
    "riscv/defmt",
    "esp32c3/defmt",
]

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.12.0", path = "../../riscv/riscv", features = ["critical-section-single-hart"] }
esp-riscv-rt = { version = "0.10.0", path = "../esp-riscv-rt" }

[build-dependencies]
cfg-if       = "1.0.0"
esp-build    = { version = "0.2.0", path = "../esp-build" }
esp-metadata = { version = "0.6.0", path = "../esp-metadata" }
