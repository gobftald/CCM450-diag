[package]
name = "esp-hal"
version = "1.0.0-beta.1"
edition = "2021"

[dependencies]
console = { path = "../../console" }
defmt = { version = "0.3.10", optional = true }
critical-section = { version = "1.2.0" }
fugit = "0.3.7"
rand_core-09 = { package = "rand_core", path = "../../rand_core" }
bytemuck = "1.22.0"
strum = { version = "0.27.1", default-features = false, features = ["derive"] }
portable-atomic = { path = "../../portable-atomic", default-features = false }
embassy-sync ={ path = "../../embassy/embassy-sync" }

# for macros
cfg-if = "1.0.0"
delegate = "0.13.3"
paste = "1.0.15"
procmacros = { package = "esp-hal-procmacros", path = "../esp-hal-procmacros" }

# IMPORTANT:
# Each supported device MUST have its PAC included below along with a
# corresponding feature.
esp32c3 = { path = "../../esp-pacs/esp32c3", features = ["rt"], optional = true }

[features]
# Chip Support Feature Flags
# Target the ESP32.
esp32   = []
# Target the ESP32-C2.
esp32c2 = []

# Target the ESP32-C3.
esp32c3 = ["dep:esp32c3", "portable-atomic/unsafe-assume-single-core",]

# Target the ESP32-C6.
esp32c6 = []
# Target the ESP32-H2.
esp32h2 = []
# Target the ESP32-S2.
esp32s2 = []
# Target the ESP32-S3.
esp32s3 = []

defmt   = [
    "dep:defmt",
    "esp-riscv-rt/defmt",
    "riscv/defmt",
    "esp32c3/defmt",
]

## Enables APIs that are not stable and thus come with no stability guarantees.
unstable = []

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { path = "../../riscv/riscv", features = ["critical-section-single-hart"] }
esp-riscv-rt = { path = "../esp-riscv-rt" }

[build-dependencies]
cfg-if       = "1.0.0"
esp-build    = { path = "../esp-build" }
esp-metadata = { path = "../esp-metadata" }
