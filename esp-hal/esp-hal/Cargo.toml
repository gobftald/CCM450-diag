[package]
name = "esp-hal"
version = "1.0.0"
edition = "2024"

[dependencies]
# Logging interfaces, they are mutually exclusive so they need to be behind separate features.
defmt = { version = "1.0.1", optional = true }
log-04 = { package = "log", version = "0.4", optional = true }

esp-config = { version = "0.6.1" }
esp-metadata-generated = { version = "0.3.0" }

# fix to restore-state-u32, synce we implement critical section with critical_section::set_impl!
# in sync.rs based on/used esp_sync::RawMutex which uses u32 in its RestoreState
# esp_sync::RawMutex is a smarter critical section not simple disabling irq in all core (if multi
# core), but disabling only one core and spinlock only other calls if they trying to lock on the
# same shared/static memory
critical-section = { version = "1.2.0", features = ["restore-state-u32"], optional = true }

esp-sync = "0.1.0"
fugit = "0.3.7"
bytemuck = "1.22.0"
strum = { version = "0.27.1", default-features = false, features = ["derive"] }
portable-atomic = { version = "1.5", default-features = false }
#embassy-sync = { path = "../../embassy/embassy-sync" }
#embassy-sync = { path = "../../embassy/embassy-sync.me" }
embassy-sync = "0.7"
bitflags = "2.9.0"
enumset = "1.1.6"

# for macros
cfg-if = "1.0.0"
delegate = "0.13.3"
paste = "1.0.15"
procmacros = { version = "0.21.0", package = "esp-hal-procmacros" }

# IMPORTANT:
# Each supported device MUST have its PAC included below along with a
# corresponding feature.
#esp32c3 = { path = "../../esp-pacs/esp32c3", features = ["rt"], optional = true }
esp32c3 = { version = "0.31.0", features = ["critical-section", "rt"], optional = true }
#esp32c3 = { path = "../../../w/esp-pacs/esp32c3", features = ["critical-section", "rt"], optional = true }

[features]
# Chip Support Feature Flags
# Target the ESP32.
esp32   = []
# Target the ESP32-C2.
esp32c2 = []

# Target the ESP32-C3.
esp32c3 = [
    "dep:esp32c3",
    "esp-riscv-rt/no-mie-mip",
    "portable-atomic/unsafe-assume-single-core",
    "esp-sync/esp32c3",
    "esp-metadata-generated/esp32c3",
]

# Target the ESP32-C6.
esp32c6 = []
# Target the ESP32-H2.
esp32h2 = []
# Target the ESP32-S2.
esp32s2 = []
# Target the ESP32-S3.
esp32s3 = []

defmt   = [
    "dep:defmt",
    "esp-riscv-rt/defmt",
    "esp32c3/defmt",
    "esp-sync/defmt",
    "enumset/defmt",
]

## Enables APIs that are not stable and thus come with no stability guarantees.
unstable = []

#! ### Runtime support
#! These features are meant to be enabled by firmware projects. If you are writing a library that
#! depends on `esp-hal`, you should *not* enable these features under any circumstance.

## Enable code necessary to run the firmware.
rt = [
    "dep:esp-riscv-rt",
    "esp32c3?/rt",
    "critical-section",
]

[target.'cfg(target_arch = "riscv32")'.dependencies]

# we don't use critical-section-single-hart feature of riscv, so we don't
# implement critical section from here,
# rather we implememnt it in in esp-sync, since this verision would be a
# general one, usable in all riscv processor, disabling irq on all cores
# (if multiple core),
# but esp-sync critical section implementation (esp_sync::RawMutex) is smarter
# see explanation above at critical-section dependency
riscv = "0.15.0"

esp-riscv-rt = { version = "0.13.0", optional = true }

[build-dependencies]
cfg-if       = "1.0.0"
esp-config = { version = "0.6.1", features = ["build"] }
esp-metadata = "0.10.0"
esp-metadata-generated = { version = "0.3.0", features = ["build-script"] }
