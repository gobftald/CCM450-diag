[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
#runner = "espflash flash --monitor"
#runner = "probe-rs run --chip esp32c3"


# using defmt crate - together with "link-arg=-Tdefmt.x" below
runner = "espflash flash --monitor --log-format defmt"


rustflags = [
    "-C", "link-arg=-Tlinkall.x",           # from esp-hal
    "-C", "link-arg=-Map=riscv32.map",
    "-C", "link-arg=-Tdefmt.x",             # for defmt
    "-C", "force-frame-pointers",          # for esp-backtrace and probe-rs-debug
                                            # otherwise some size ovehead occurs (in ELF file only)
                                            # when making frame for every real (not inlined) function call
                                            # it's not relevant, esp-backtrace uses frame pointers to walk
                                            # the stack easily and with low overhead, 
    #"-Z", "unstable-options",
    #"-C", "panic=immediate-abort",          # the order is important: first unstable then panic
]

[unstable]
# this will codegen every panic as an abort instruction without any panic message formatting.
#build-std-features = ["panic_immediate_abort"] # in the new compiler needs "-Z", "unstable-options",
                                                # and "-C", "panic=immediate-abort" rustflags above
#build core from source with "panic_immediate_abort" feature
build-std = ["core", "alloc"]

[patch.crates-io]
esp-alloc = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-backtrace = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-config = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-hal = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-hal-procmacros = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-metadata-generated = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-metadata = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-phy = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-println = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-radio = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-radio-rtos-driver = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-riscv-rt = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-rom-sys = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-sync = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }

#esp-alloc = { path = "../esp-hal/esp-alloc" }
#esp-backtrace = { path = "../esp-hal/esp-backtrace" }
#esp-config = { path = "../esp-hal/esp-config" }
#esp-hal = { path = "../esp-hal/esp-hal" }
#esp-hal-procmacros = { path = "../esp-hal/esp-hal-procmacros" }
#esp-metadata-generated = { path = "../esp-hal/esp-metadata-generated" }
#esp-metadata = { path = "../esp-hal/esp-metadata" }
#esp-phy = { path = "../esp-hal/esp-phy" }
#esp-println = { path = "../esp-hal/esp-println" }
#esp-radio = { path = "../esp-hal/esp-radio" }
#esp-radio-rtos-driver = { path = "../esp-hal/esp-radio-rtos-driver" }
#esp-riscv-rt = { path = "../esp-hal/esp-riscv-rt" }
#esp-rom-sys = { path = "../esp-hal/esp-rom-sys" }
#esp-sync = { path = "../esp-hal/esp-sync" }

rtos-trace = { path = "../rtos-trace/rtos_trace" }
systemview-target = { path = "../rtos-trace/systemview_target" }

[env]
# Manually register and import this shared cfg used by esp-rtos, esp-radio
# and esp-radio-rtos-driver.
# It enables task name string support in the RTOS scheduler, whch makes
# tracing significantly easier in eps-rtos.
ESP_RTOS_TASK_NAME_STR = "true"

# Explicitly add _zicsr to the architecture string for C/C++ builds
CFLAGS = "-march=rv32imc_zicsr"

# This defines exactly what you see in the console. 
# {t} = time, {L} = level (INFO/DEBUG), {s} = your message.
DEFMT_LOG_FORMAT = "{t} [{L}] {s}"
