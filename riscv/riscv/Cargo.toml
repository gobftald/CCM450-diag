[package]
name = "riscv"
version = "0.12.0"
edition = "2021"

[dependencies]
riscv-pac = { path = "../riscv-pac", version = "0.2.0" }
defmt = { version = "0.3.10", optional = true }
critical-section = "1.2.0"

[features]
defmt = ["dep:defmt", "riscv-pac/defmt"]
s-mode = []

#critical-section-single-hart = ["critical-section/restore-state-bool"]
# because of REENTRY_FLAG in critical_section implemantation in esp-hal/sync
critical-section-single-hart = ["critical-section/restore-state-u8"]
