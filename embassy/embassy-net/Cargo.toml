[package]
name = "embassy-net"
version = "0.7.0"
edition = "2021"

[dependencies]
defmt = { version = "0.3.10", optional = true }
embassy-time = { path = "../embassy-time" }
smoltcp = { path = "../../smoltcp", default-features = false, features = ["socket", "async"] }
allocator-api2 = { path = "../../allocator-api2", features = ["alloc"] }

[features]
defmt = ["dep:defmt", "smoltcp/defmt"]

## Enable DHCPv4 support
dhcpv4 = ["proto-ipv4", "smoltcp/socket-dhcpv4"]
## Enable DHCPv4 support with hostname
dhcpv4-hostname = ["dhcpv4"]
## Enable IPv4 support
proto-ipv4 = ["smoltcp/proto-ipv4"]
## Enable IPv6 support
proto-ipv6 = ["smoltcp/proto-ipv6"]