[package]
name = "embassy-net"
version = "0.5.0"
edition = "2021"

[dependencies]
#console = { path = "../../console" }
#defmt = { version = "0.3.10", optional = true }
defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }
embassy-net-driver = { path = "../embassy-net-driver" }
embassy-time = { path = "../embassy-time" }
#embassy-sync = { path = "../embassy-sync" }
#embassy-sync = { path = "../embassy-sync.me" }
embassy-sync = "0.7"
smoltcp = { path = "../../smoltcp/smoltcp", default-features = false, features = ["socket", "async"] }
allocator-api2 = { path = "../../allocator-api2.me", features = ["alloc"] }
#allocator-api2 = { version = "0.3.0", default-features = false, features = ["alloc"] }

[features]
#defmt = ["dep:defmt", "embassy-net-driver/defmt", "smoltcp/defmt", "allocator-api2/defmt"]
defmt = ["dep:defmt", "embassy-net-driver/defmt", "smoltcp/defmt"]

## Trace all raw received and transmitted packets using defmt or log.
packet-trace = []

## Enable ICMP support
icmp = ["smoltcp/socket-icmp"]
## Enable UDP support
udp = ["smoltcp/socket-udp"]
## Enable DHCPv4 support
dhcpv4 = ["proto-ipv4", "medium-ethernet", "smoltcp/socket-dhcpv4"]
## Enable IPv4 support
proto-ipv4 = ["smoltcp/proto-ipv4"]
## Enable IPv6 support
proto-ipv6 = ["smoltcp/proto-ipv6"]
## Enable the Ethernet medium
medium-ethernet = ["smoltcp/medium-ethernet"]
## Enable smoltcp alloc feature (necessary if using "managed" crate alloc feature)
alloc = ["smoltcp/alloc"]