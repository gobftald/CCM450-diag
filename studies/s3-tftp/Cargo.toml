[package]
name = "s3-tftp"
version = "0.1.0"
edition = "2024"

[dependencies]
cfg-if = "1.0.0"
esp-println = { version = "0.16.0", default-features = false, features = ["critical-section"] }
esp-backtrace = { version = "0.18.0", features = ["panic-handler"], optional = true }
log = { version = "0.4.14", optional = true }
defmt = { version = "1.0.1", optional = true }

esp-hal = { version = "1.0.0", features = ["unstable"] }
esp-bootloader-esp-idf = "0.4.0"
esp-alloc = { version = "0.9.0", default-features = false }
static_cell = "2.1.0"

esp-rtos = { version = "0.2.0", features = ["esp-radio", "embassy", "esp-alloc"] }
# if we use only udp we don't need most of wpa-supplicant library
#esp-radio = { version = "0.17.0", features = ["wifi", "no_wpa_supplicant"] }
esp-radio = { version = "0.17.0", features = ["wifi"] }

embassy-executor = "0.9.0"
embassy-time = "0.5.0"
embassy-sync = "0.7.2"
embassy-embedded-hal = { version = "0.5.0", features = ["time"] }
embassy-futures = "0.1.2"
# although we don't plan to use "dhcpv4" feature we define it
# since it products less code in icmp and udp because we can implement only "icmp echo" 
embassy-net = { version = "0.7.1", features = ["udp", "tcp", "dhcpv4"]}

rtos-trace = { version = "0.2.1", optional = true }
rtt-target = { version = "0.6.2", optional = true }
systemview-target = { version = "0.3", optional = true, default-features = false, features = ["ext-rtt-channels-2"] }

leasehund = "0.2.0"

embedded-sdmmc = { version = "0.9.0", default-features = false }
embedded-hal = "1.0.0"
embedded-io-async = "0.6.1"

embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4.0"
lcd-async = "0.1.3"
cst816s = "1.0.1"

xtensa-lx = "0.13.0"

[features]
default = [
    "esp32s3",
    "psram",
    "defmt",
]

esp32s3 = [
    "esp-println/esp32s3",
    "esp-println/jtag-serial",
    "esp-backtrace?/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-hal/rt",
    "embassy-executor/nightly",     # for 'task' embassy-executor-macro
    "esp-radio/esp32s3",
    "esp-rtos/esp32s3",
]

defmt = [
    "dep:defmt",
    "esp-backtrace?/defmt",
    "esp-bootloader-esp-idf/defmt",
    "esp-hal/defmt",
    "esp-alloc/defmt",
    "embassy-executor/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "esp-radio/defmt",
    "embassy-net/defmt",
    "esp-rtos/defmt",

    "esp-println/defmt-espflash",       # if you use rtt (rtt_target) it should be commented out
                                        # since rtt-target/defmt also defines defmt symbols
    "embedded-sdmmc/defmt-log",
    "embassy-embedded-hal/defmt",
    "lcd-async/defmt",
]

psram = ["esp-hal/psram"]

backtrace = ["dep:esp-backtrace"]       # needs "-C", "force-frame-pointers" rustflag in config.toml
                                        # needs to comment "-C", "panic=immediate-abort" out

rtos_trace = ["esp-rtos/rtos-trace", "dep:rtos-trace", "dep:systemview-target", "rtt"]
rtt = ["dep:rtt-target"]                # "esp-println/defmt-espflash" should be commented out

## My custom features (some of them needs esp-hal patches)
heap_stats = ["esp-alloc/internal-heap-stats"]
idle_stats = ["esp-rtos/idle_stats"]
irq_stats = ["esp-hal/irq_stats"]
