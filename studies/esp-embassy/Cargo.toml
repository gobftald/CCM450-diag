[package]
name = "esp-embassy"
version = "0.1.0"
edition = "2021"

[dependencies]
console          = { path = "../../console", features = ["usb_uart"]}
defmt            = { version = "0.3.10", optional = true }
esp-hal          = { path = "../../esp-hal/esp-hal" }

esp-hal-embassy  = { path = "../../esp-hal/esp-hal-embassy"  }
embassy-executor = { path = "../../embassy/embassy-executor" }

[dependencies.esp-backtrace]
    version = "0.15.1"
    features = ["panic-handler", "exception-handler"]
    path = "../../esp-hal/esp-backtrace"
    optional = true


[features]
default = [
    "esp32c3",
    "defmt",
]

esp32c3 = [
    "esp-backtrace?/esp32c3",
    "esp-hal/esp32c3",
    "esp-hal-embassy/esp32c3",
    "embassy-executor/nightly",     # for 'task' embassy-executor-macro 
]

defmt = [
    "dep:defmt",
    "console/defmt",
    "esp-backtrace?/defmt",
    "esp-hal/defmt",
    "embassy-executor/defmt",
]

backtrace = ["dep:esp-backtrace"]       # needs "-C", "force-frame-pointers" rustflag in config.toml
                                        # needs to comment build-std-features = ["panic_immediate_abort"] out
