[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor"

# using defmt crate - together with "link-arg=-Tdefmt.x" below
#runner = "espflash flash --monitor --log-format defmt"


rustflags = [
    "-C", "link-arg=-Tlinkall.x",           # from esp-hal
    "-C", "link-arg=-Map=riscv32.map",
    #"-C", "link-arg=-Tdefmt.x",             # for defmt
    #"-C", "force-frame-pointers",           # for esp-backtrace
                                            # otherwise some size ovehead occurs
                                            # when making frame for every real (not inlined) function call
    "-Z", "unstable-options",
    "-C", "panic=immediate-abort",
]

[unstable]
# this will codegen every panic as an abort instruction without any panic message formatting.
#build-std-features = ["panic_immediate_abort"] # in the new compiler needs "-Z", "unstable-options",
                                                # and "-C", "panic=immediate-abort" rustflags above
#build core from source with "panic_immediate_abort" feature
build-std = ["core", "alloc"]

[patch.crates-io]
esp-alloc = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-backtrace = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-config = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
#esp-hal = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-metadata-generated = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-println = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }
esp-sync = { git = "https://github.com/gobftald/esp-hal.git", branch = "patches" }

#esp-alloc = { path = "../../esp-hal/esp-alloc" }
#esp-backtrace = { path = "../../esp-hal/esp-backtrace" }
#esp-config = { path = "../../esp-hal/esp-config" }
#esp-hal = { path = "../../esp-hal/esp-hal" }
#esp-metadata-generated = { path = "../../esp-hal/esp-metadata-generated" }
#esp-println = { path = "../../esp-hal/esp-println" }
#esp-sync = { path = "../../esp-hal/esp-sync" }
